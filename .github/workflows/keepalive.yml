name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days without repo
# activity (state: disabled_inactivity), which silently stopped the
# refresh. Commit to main once a month so that never triggers.

on:
  schedule:
    - cron: "17 3 1 * *"   # monthly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empty keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive"
          git push
