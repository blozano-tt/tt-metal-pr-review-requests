name: Refresh PR review-request table

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]

# Allow one concurrent deployment; don't cancel an in-flight Pages deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate site
        env:
          # Prefer a narrowly-scoped read-only PAT if the repo owner adds one.
          # Both are passed so the generator can fall back to the automatic
          # per-run token if the PAT is missing, revoked or expired.
          GH_TOKEN: ${{ secrets.TT_METAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: public
        run: python scripts/generate.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
